# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Weekday Ingestion Workflow
# ─────────────────────────────────────────────────────────────────────────────
#
# Schedule : Mon–Sat at 10:30 AM IST (UTC 05:00)
# Triggers : Cron + manual dispatch (workflow_dispatch)
#
# Jobs:
#   1. check-holiday  : Skip execution on NSE/BSE holidays
#   2. ingest         : Trigger Railway /api/admin/ingest + verify health
#   3. notify-failure : Create a GitHub Issue on ingestion failure
#
# Phase 5: Full implementation with Railway deployment integration.
# ─────────────────────────────────────────────────────────────────────────────

name: Weekday Ingestion

on:
  # Mon–Sat 10:30 AM IST = 05:00 UTC
  schedule:
    - cron: "0 5 * * 1-6"

  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run even on holidays"
        required: false
        default: "false"
        type: boolean

# Explicit permissions — required for the notify-failure job to create Issues
permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.11"
  CORPUS_CONFIG:  "data/corpus.yml"
  VECTORSTORE:    "data/vectorstore"

jobs:
  # ── Job 1: Holiday Check ────────────────────────────────────────────────────
  check-holiday:
    name: Holiday Check
    runs-on: ubuntu-latest
    outputs:
      is_holiday: ${{ steps.check.outputs.is_holiday }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if today is a market holiday
        id: check
        run: |
          python - <<'EOF'
          import json
          import datetime
          import os

          today = datetime.date.today().isoformat()
          force = "${{ github.event.inputs.force_run }}" == "true"

          with open("data/holidays.json") as f:
              holidays = json.load(f)

          is_holiday = today in holidays and not force
          print(f"Today: {today}")
          print(f"Is holiday: {is_holiday}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_holiday={'true' if is_holiday else 'false'}\n")
          EOF

  # ── Job 2: Trigger Railway Ingestion ─────────────────────────────────────────
  ingest:
    name: Trigger Railway Ingestion
    runs-on: ubuntu-latest
    needs: check-holiday
    if: needs.check-holiday.outputs.is_holiday == 'false'

    steps:
      - name: Trigger Railway Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://rag-chat-bot-production.up.railway.app/api/admin/ingest)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to trigger ingestion! HTTP Status: $HTTP_STATUS"
            exit 1
          fi
          echo "Ingestion triggered successfully."

      - name: Wait for Background Task
        run: sleep 45

      - name: Verify Health Endpoint
        run: |
          CHUNKS=$(curl -s https://rag-chat-bot-production.up.railway.app/api/health | grep -o '"vectorstore_chunks":[0-9]*' | cut -d':' -f2)
          if [ -z "$CHUNKS" ] || [ "$CHUNKS" -eq 0 ]; then
            echo "Ingestion failed to populate chunks! (Count is 0 or missing)"
            exit 1
          fi
          echo "Verified vector store is populated with $CHUNKS chunks."

  # ── Job 3: Failure Notification ────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [check-holiday, ingest]
    # Run if any of the above jobs failed (but not if they were skipped)
    if: failure()

    steps:
      - name: Create GitHub Issue for ingestion failure
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `[Ingestion Failure] ${today}`,
              body: [
                "## ⚠️ Automated Ingestion Failed",
                "",
                `**Date**: ${today}`,
                `**Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                "",
                "### Next Steps",
                "1. Check the failed run logs linked above.",
                "2. Verify the Railway service is running (`/api/health`).",
                "3. Check `GROQ_API_KEY` and other Railway env vars are valid.",
                "4. Re-trigger manually after fixing: `workflow_dispatch`.",
              ].join("\n"),
              labels: ["bug", "automated-ingestion"],
            });

