# ──────────────────────────────────────────────────────────────────
# pytest configuration for RAG Mutual Fund FAQ Assistant
# ──────────────────────────────────────────────────────────────────

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display
addopts =
    -v
    --tb=short
    --color=yes

# Markers (used to organise phase-specific tests)
markers =
    phase2: Tests for Phase 2 (RAG Engine)
    phase3: Tests for Phase 3 (Guardrails)
    phase5: Tests for Phase 5 (Evaluation)
    slow: Long-running tests (e.g. embedding model load)
