# Railway configuration for RAG Mutual Fund FAQ Assistant
# Architecture ref: §15.2 Production (Railway backend)
# Docs: https://docs.railway.app/reference/config-as-code

[deploy]
startCommand = "uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/api/health"
healthcheckTimeout = 120    # seconds -- allow BGE model warm-up
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
